# CMSIS-DAP / DAPLink probe
adapter driver cmsis-dap
transport select swd

# STM32H723VGT6: Cortex-M7, STM32H7 single-core target
source [find target/stm32h7x.cfg]

# Start with a conservative SWD clock. It can be increased after the
# connection and programming process have been verified to be stable.
adapter speed 4000
